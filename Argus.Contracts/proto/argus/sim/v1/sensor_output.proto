// Dashboard sensor envelopes and scalar/vector payloads; camera frames use the render link.
syntax = "proto3";
package argus.sim.v1;
import "google/protobuf/timestamp.proto";
import "argus/sim/v1/devices.proto";
option csharp_namespace = "Argus.Contracts.Sim.V1";

enum SensorFrameStatus {
  SENSOR_FRAME_STATUS_UNSPECIFIED = 0;
  SENSOR_FRAME_STATUS_VALID = 1;
  SENSOR_FRAME_STATUS_UNAVAILABLE = 2;
  SENSOR_FRAME_STATUS_STALE = 3;
  SENSOR_FRAME_STATUS_INVALID = 4;
}
message SensorFrame {
  // Opaque run identity; not a coordinate or a timestamp.
  string run_id = 1;
  // Sensor identity within this run.
  string sensor_id = 2;
  // Sensor coordinate-frame label, copied from Core FrameId.
  string frame_id = 3;
  // Nonnegative per-sensor sequence, not engine step.
  optional int64 sequence = 4;
  // Acquisition time in seconds since simulation start, not publication time.
  optional double simulation_time_s = 5;
  // UTC corresponding to acquisition time above.
  google.protobuf.Timestamp timestamp_utc = 6;
  // Map explicitly: Core Valid=0 does NOT equal the wire zero value.
  SensorFrameStatus status = 7;
  // Producer label from Core Source, e.g. backend/model identifier.
  string source = 8;
  // Required presence: Core ISensorFrame.StateSequence, including on failures.
  // Zero is a valid capture step; absent is invalid. Never substitute delivery step.
  optional int64 capture_state_sequence = 9;
  reserved 10 to 13; // Former per-kind payload oneof.
  // Registered Core kind name, required even without data; e.g. light_sensor.
  string kind = 14;
  // Kind-declared keys/types/units. VALID/STALE: nonempty; UNAVAILABLE/INVALID: empty.
  // Cached frames retain status and acquisition metadata unchanged.
  map<string, DeviceValue> payload = 15;
}
message SensorOutputSet {
  // Opaque run identity; not a coordinate or a timestamp.
  string run_id = 1;
  // Stream path: current enclosing state.spacecraft.sequence; frames are the
  // latest-per-sensor cache as of that step. Direct per-step Core output path:
  // step when SensorManager published the set. Neither is a frame's capture step.
  optional int64 spacecraft_sequence = 2;
  // Publication/snapshot time, seconds since simulation start.
  optional double simulation_time_s = 3;
  // Stream projection contains at most one latest frame per non-camera sensor.
  // Frames may have earlier acquisition times; an empty list is legitimate.
  repeated SensorFrame frames = 4;
}
