// Per-device commands (D11, docs/device-model.md §6). SI units; each kind declares its command
// keys and types, as it declares its parameters.
syntax = "proto3";

package argus.sim.v1;

import "argus/sim/v1/devices.proto";

option csharp_namespace = "Argus.Contracts.Sim.V1";

// One configured actuator's command values.
message DeviceCommand {
  // A configured actuator's DeviceConfiguration.device_id. Any other ID: INVALID_ARGUMENT.
  string device_id = 1;
  // Exactly the kind's command keys.
  map<string, DeviceValue> values = 2;
}

// The values of Core DeviceCommandSet; its sequence and time travel in the enclosing request. A
// step's command is complete: an actuator it leaves out uses its kind's idle values, so the empty
// set means no output. Each device appears at most once.
message DeviceCommandSet {
  repeated DeviceCommand commands = 1;
}
