// Host-to-Unity display snapshots. Native gRPC/HTTP2; see README for delivery rules.
syntax = "proto3";
package argus.stream.v1;
import "argus/sim/v1/state.proto";
import "argus/sim/v1/sensor_output.proto";
option csharp_namespace = "Argus.Contracts.Stream.V1";

service StateStreamService {
  // Subscribe to the active run. Live data, not recorder replay or a control API.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// Start with host-configured delivery rate; no runtime tuning interface yet.
message SubscribeRequest {}
message SubscribeResponse {
  // Both required, even when sensor_output.frames is empty. Their run IDs and
  // publication step/time must match. Original acquisition metadata stays on frames.
  argus.sim.v1.SimulationState state = 1;
  argus.sim.v1.SensorOutputSet sensor_output = 2;
}
